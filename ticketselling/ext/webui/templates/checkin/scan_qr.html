{% extends "layout/checkin_base.html" %}

{% block title %}Soát vé QR - Ticket Admin{% endblock %}
{% block page_heading %}Hệ thống Soát Vé (Check-in){% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body text-center p-4">
                <h5 class="card-title mb-3">Đưa mã QR vào khung hình để quét</h5>
                <div id="qr-reader" style="width:100%; max-width:400px; margin: 0 auto;"></div>
                <div id="scan-result" class="mt-3"></div>
                <hr class="my-4">
                <form id="manual-checkin-form">
                    <div class="input-group">
                        <input type="text" id="manual-ticket-code" class="form-control" placeholder="Hoặc nhập mã vé thủ công..." required>
                        <button type="submit" class="btn btn-primary">Check-in</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="{{ url_for('webui.static', filename='js/qr_scanner.js') }}"></script>
{% endblock %}
